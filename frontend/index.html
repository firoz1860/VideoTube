<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <title>VidTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Paint a background immediately so the first frame is never a white flash. */
      html, body { margin: 0; background: #0F1729; }
      /* Instant app shell — shown the moment HTML arrives, before the JS bundle
         has downloaded or React has mounted. React replaces #root's contents on
         mount, which removes this automatically. */
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #0F1729;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      #app-splash .splash-logo {
        display: flex; align-items: center; gap: 9px;
        font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.02em;
      }
      #app-splash .splash-mark {
        width: 30px; height: 30px; border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #7c3aed, #5b21b6);
      }
      #app-splash .splash-spinner {
        width: 36px; height: 36px; border-radius: 50%;
        border: 3px solid rgba(124, 58, 237, 0.25); border-top-color: #7c3aed;
        animation: splash-spin 0.7s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="splash-logo">
          <span class="splash-mark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 5v14l11-7L8 5z" fill="#ffffff" />
            </svg>
          </span>
          VidTube
        </div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
